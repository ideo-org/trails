name: Bun Build

on:
  push:
    branches: [main]
    paths:
      - 'firebase-functions/**'
      - '.github/workflows/bun-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firebase-functions/**'
      - '.github/workflows/bun-build.yml'
  workflow_dispatch:

concurrency:
  group: bun-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-build:
    name: Build Firebase Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: firebase-functions/functions

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint
